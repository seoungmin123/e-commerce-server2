version: '3'
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=application
      - MYSQL_PASSWORD=application
      - MYSQL_DATABASE=hhplus
    volumes:
      - ./data/mysql/:/var/lib/mysql
   #   - ./init/02-init.sql:/docker-entrypoint-initdb.d/02-init.sql
    #  - ./init/03-test-data.sql:/docker-entrypoint-initdb.d/03-test-data.sql
    #  - ./init/04-test_dummy.sql:/docker-entrypoint-initdb.d/04-test_dummy.sql
     # - ./init/05-product_popularity_dummy.sql:/docker-entrypoint-initdb.d/05-product_popularity_dummy.sql
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes  # 데이터 지속성을 위한 AOF 설정

networks:
  default:
    driver: bridge